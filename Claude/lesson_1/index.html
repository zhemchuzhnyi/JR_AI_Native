<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLAWD Wisdom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <h1 class="stage__title">One click, <span class="stage__accent">one wisdom.</span></h1>
    <p class="stage__caption">Move your cursor — the spark will follow.</p>
    <p class="stage__counter">Tips opened: <span id="tip-count">0</span></p>
  </main>

  <img
    class="mascot"
    id="mascot"
    src="assets/clawd.svg"
    alt=""
    width="180"
    draggable="false"
    aria-hidden="true"
  >

  <script src="js/script.js" defer></script>
</body>
</html>
